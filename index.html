<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#182a34">
  <title>Henry Control Works · Research Desk Prototype</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17252d;
      --ink-soft: #526169;
      --paper: #ece9de;
      --paper-deep: #ddd9cc;
      --desktop: #aab4b0;
      --desktop-dark: #899590;
      --line: #6c7877;
      --line-dark: #263b43;
      --navy: #183746;
      --navy-2: #244d5d;
      --blue: #276783;
      --blue-light: #d2e3e8;
      --orange: #cc6c35;
      --orange-light: #f0d4bd;
      --green: #3f7569;
      --green-light: #d2dfd8;
      --red: #a94133;
      --shadow: rgb(21 32 36 / 28%);
      --grid: rgb(37 57 63 / 12%);
      --topbar: 38px;
      --dock: 76px;
      font-family: "SFMono-Regular", "Berkeley Mono", Consolas, "Liberation Mono", monospace;
      font-size: 16px;
      background: var(--desktop);
      color: var(--ink);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    button, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, textarea:focus-visible { outline: 2px solid #f6ad61; outline-offset: -2px; }

    .workstation {
      height: 100%;
      display: grid;
      grid-template-rows: var(--topbar) minmax(0, 1fr);
      background: var(--desktop);
    }

    .system-bar {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 11px;
      color: #edf2ef;
      border-bottom: 1px solid #07161d;
      background: var(--navy);
      box-shadow: 0 2px 0 rgb(255 255 255 / 12%) inset;
      user-select: none;
    }

    .hcw-mark {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      color: var(--navy);
      background: #e8e4d4;
      font-size: .6rem;
      font-weight: 900;
      letter-spacing: -.04em;
      clip-path: polygon(0 0, calc(100% - 5px) 0, 100% 5px, 100% 100%, 5px 100%, 0 calc(100% - 5px));
    }

    .system-title { min-width: 0; font-size: .67rem; font-weight: 800; letter-spacing: .08em; white-space: nowrap; }
    .system-context { color: #9fb6be; font-size: .55rem; letter-spacing: .06em; white-space: nowrap; }
    .system-spacer { flex: 1; }
    .system-status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #c9d7d9;
      font-size: .53rem;
      white-space: nowrap;
    }
    .status-dot { width: 7px; height: 7px; background: #79b09b; border: 1px solid #b8d8cb; }

    .desktop-region {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: var(--dock) minmax(0, 1fr);
    }

    .launcher {
      min-height: 0;
      padding: 8px 7px;
      overflow: auto;
      border-right: 1px solid var(--line-dark);
      background: #c5ccc6;
      box-shadow: -8px 0 14px rgb(255 255 255 / 24%) inset;
    }

    .launcher-label {
      margin: 2px 0 8px;
      color: var(--ink-soft);
      font-size: .47rem;
      font-weight: 800;
      letter-spacing: .1em;
      text-align: center;
    }

    .launch-button {
      width: 62px;
      min-height: 60px;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 4px;
      margin: 0 0 6px;
      padding: 5px 2px 4px;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
    }

    .launch-button:hover { border-color: #71807d; background: rgb(239 239 226 / 58%); }
    .launch-button[data-open="true"] { color: #173e4e; background: rgb(222 234 230 / 72%); border-color: #68827d; }
    .launch-icon {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line-dark);
      background: var(--paper);
      box-shadow: 3px 3px 0 rgb(38 59 67 / 18%);
      font-size: .58rem;
      font-weight: 900;
    }
    .launch-button[data-app="designer"] .launch-icon { background: #203d49; color: #cfe4e7; }
    .launch-button[data-app="manual"] .launch-icon { background: #e4dac5; color: #704c31; }
    .launch-button[data-app="contract"] .launch-icon { background: #d4dfd9; color: #285e53; }
    .launch-button[data-app="trace"] .launch-icon { background: #ead1c1; color: #893e2b; }
    .launch-button[data-app="notes"] .launch-icon { background: #ede7ad; color: #625c25; }
    .launch-button[data-app="files"] .launch-icon { background: #d7d1b8; color: #67592d; }
    .launch-button[data-app="archive"] .launch-icon { background: #d9dce1; color: #3e4b60; }
    .launch-name { max-width: 58px; font-size: .46rem; font-weight: 800; line-height: 1.15; text-align: center; }

    .minimized-tray {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #71807d;
    }
    .minimized-tray[hidden] { display: none; }
    .minimized-list { display: grid; gap: 5px; }
    .minimized-button {
      width: 62px;
      min-height: 44px;
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      align-items: center;
      gap: 4px;
      padding: 4px;
      border: 1px solid #6d7875;
      background: #e0e1d8;
      cursor: pointer;
      font-size: .41rem;
      font-weight: 800;
      text-align: left;
    }
    .minimized-button:hover { background: #f2f2e8; }
    .minimized-icon { display: grid; place-items: center; width: 22px; height: 22px; color: white; background: var(--navy-2); font-size: .39rem; }
    .minimized-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .desktop-plane {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background-color: var(--desktop);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        linear-gradient(135deg, rgb(255 255 255 / 10%), transparent 46%);
      background-size: 18px 18px, 18px 18px, 100% 100%;
    }

    .desktop-stamp {
      position: absolute;
      right: 14px;
      bottom: 12px;
      color: rgb(29 48 53 / 42%);
      font-size: .5rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-align: right;
      user-select: none;
      pointer-events: none;
    }
    .desktop-stamp strong { display: block; margin-top: 2px; font-size: .68rem; letter-spacing: .12em; }

    .snap-preview {
      position: absolute;
      z-index: 9998;
      display: none;
      border: 2px dashed #dce9e7;
      background: rgb(30 83 99 / 18%);
      pointer-events: none;
    }
    .snap-preview.visible { display: block; }

    .app-window {
      position: absolute;
      min-width: 260px;
      min-height: 160px;
      display: grid;
      grid-template-rows: 31px minmax(0, 1fr) 20px;
      overflow: visible;
      border: 1px solid var(--line-dark);
      background: var(--paper);
      box-shadow: none;
      transform: translate3d(0, 0, 0);
    }
    .app-window[hidden] { display: none; }
    .app-window.active { border-color: #0c2d3a; box-shadow: none; }
    .app-window[data-app="designer"] { box-shadow: 7px 8px 0 var(--shadow); }
    .app-window[data-app="designer"].active { box-shadow: 8px 10px 0 rgb(18 42 50 / 35%); }
    .app-window[data-app="palette"] { box-shadow: 7px 8px 0 var(--shadow); }
    .app-window[data-app="palette"].active { box-shadow: 8px 10px 0 rgb(18 42 50 / 35%); }
    .app-window[data-app="palette"][data-palette-docked="true"][data-palette-side="right"] {
      border-right: 0;
      box-shadow: 0 8px 0 var(--shadow);
    }
    .app-window[data-app="palette"][data-palette-docked="true"][data-palette-side="right"].active {
      box-shadow: 0 10px 0 rgb(18 42 50 / 35%);
    }
    .app-window[data-app="designer"][data-palette-docked="true"][data-palette-side="right"] {
      border-right: 0;
      box-shadow: 0 8px 0 var(--shadow);
    }
    .app-window[data-app="designer"][data-palette-docked="true"][data-palette-side="right"].active {
      box-shadow: 0 10px 0 rgb(18 42 50 / 35%);
    }
    .titlebar {
      min-width: 0;
      display: grid;
      grid-template-columns: 27px minmax(0, 1fr) auto;
      align-items: stretch;
      border-bottom: 1px solid var(--line-dark);
      background: #9da8a5;
      cursor: move;
      user-select: none;
      touch-action: none;
    }
    .active .titlebar { color: #eff4f1; background: var(--navy-2); }
    .window-code {
      display: grid;
      place-items: center;
      border-right: 1px solid var(--line-dark);
      background: rgb(255 255 255 / 18%);
      font-size: .53rem;
      font-weight: 900;
    }
    .window-heading { min-width: 0; display: flex; align-items: baseline; gap: 8px; padding: 6px 8px 0; }
    .window-heading strong { overflow: hidden; font-size: .59rem; letter-spacing: .055em; text-overflow: ellipsis; white-space: nowrap; }
    .window-heading small { overflow: hidden; color: currentColor; opacity: .64; font-size: .45rem; text-overflow: ellipsis; white-space: nowrap; }
    .window-controls { display: flex; align-items: stretch; }
    .window-control {
      width: 27px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-left: 1px solid var(--line-dark);
      background: rgb(255 255 255 / 14%);
      cursor: pointer;
      font-size: .62rem;
      line-height: 1;
    }
    .window-control:hover { background: rgb(255 255 255 / 34%); }
    .window-control.pin[aria-pressed="true"] { color: white; background: var(--orange); }
    .window-control.close:hover { color: white; background: var(--red); }
    .window-control svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: square; stroke-linejoin: miter; }
    .window-control.pin svg { fill: currentColor; stroke: none; }

    .window-body { min-width: 0; min-height: 0; overflow: auto; background: var(--paper); }
    .app-window[data-app="designer"] .window-body,
    .app-window[data-app="palette"] .window-body { overflow: visible; }
    .window-footer {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 7px;
      border-top: 1px solid #8b928d;
      color: var(--ink-soft);
      background: var(--paper-deep);
      font-size: .43rem;
      letter-spacing: .04em;
      user-select: none;
    }
    .window-footer span:last-child { margin-left: auto; }
    .resize-handle {
      position: absolute;
      z-index: 4;
      touch-action: none;
    }
    .resize-handle[data-resize="w"] { left: 0; top: 31px; bottom: 20px; width: 6px; cursor: ew-resize; }
    .resize-handle[data-resize="e"] { right: 0; top: 31px; bottom: 20px; width: 6px; cursor: ew-resize; }
    .resize-handle[data-resize="s"] { left: 17px; right: 17px; bottom: 0; height: 6px; cursor: ns-resize; }
    .resize-handle[data-resize="sw"],
    .resize-handle[data-resize="se"] { bottom: 0; width: 17px; height: 17px; }
    .resize-handle[data-resize="sw"] {
      left: 0;
      cursor: nesw-resize;
      background: repeating-linear-gradient(45deg, transparent 0 3px, #63706e 3px 4px);
      clip-path: polygon(0 0, 100% 100%, 0 100%);
    }
    .resize-handle[data-resize="se"] {
      right: 0;
      cursor: nwse-resize;
      background: repeating-linear-gradient(135deg, transparent 0 3px, #63706e 3px 4px);
      clip-path: polygon(100% 0, 100% 100%, 0 100%);
    }
    .app-toolbar {
      min-height: 33px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 7px;
      border-bottom: 1px solid #8e9690;
      background: #d8d9d0;
    }
    .tool-button {
      min-height: 22px;
      padding: 2px 6px;
      border: 1px solid #657270;
      background: #edede5;
      font-size: .47rem;
      font-weight: 800;
    }
    .tool-button.selected { color: white; background: var(--blue); }
    .tool-spacer { flex: 1; }
    .tool-readout { color: var(--ink-soft); font-size: .45rem; }

    .designer-app { height: 100%; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); }
    .designer-layout { position: relative; min-height: 0; display: grid; grid-template-columns: 116px minmax(0, 1fr); overflow: visible; }
    .designer-layout.palette-detached { grid-template-columns: minmax(0, 1fr); }
    .component-rail { min-height: 0; padding: 8px; overflow: auto; border-right: 1px solid #818c88; background: #d4d5cc; }
    .designer-layout.palette-detached .component-rail { display: none; }
    .rail-label { margin: 0 0 7px; color: var(--ink-soft); font-size: .46rem; font-weight: 900; letter-spacing: .07em; }
    .rail-heading { display: flex; align-items: center; gap: 4px; margin-bottom: 7px; }
    .rail-heading .rail-label { flex: 1; margin: 0; }
    .detach-button {
      width: 22px;
      height: 20px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid #657270;
      background: #edede5;
      cursor: pointer;
    }
    .detach-button:hover { background: white; }
    .detach-button svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.6; }
    .component-chip {
      position: relative;
      width: 100%;
      height: 38px;
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      align-items: center;
      gap: 7px;
      margin: 0 0 5px;
      padding: 0 7px;
      border: 1px solid #75807c;
      background: #ecebe2;
      cursor: pointer;
      text-align: left;
    }
    .component-name {
      min-width: 0;
      overflow: hidden;
      font-size: .43rem;
      font-weight: 900;
      letter-spacing: .025em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .component-cell { width: 22px; height: 22px; border: 1px solid #33464c; background: var(--orange); }
    .component-cell.wall { background: #364e58; }
    .component-cell.input { background: #d5a43e; }
    .component-cell.output { background: #a74f42; }
    .component-chip.selected { color: white; border-color: var(--navy); background: var(--navy-2); }
    .component-chip.disabled { opacity: .48; cursor: not-allowed; }
    .work-grid {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background-color: #14272f;
      outline: 0;
    }
    .work-grid:focus-visible { box-shadow: 0 0 0 2px #f6ad61 inset; }
    .design-world {
      position: absolute;
      left: 0;
      top: 0;
      width: 1800px;
      height: 1200px;
      transform-origin: 0 0;
      background-color: #14272f;
      background-image:
        linear-gradient(rgb(218 231 230 / 13%) 1px, transparent 1px),
        linear-gradient(90deg, rgb(218 231 230 / 13%) 1px, transparent 1px);
      background-size: 18px 18px;
    }
    .design-world::before {
      content: "DESIGN SURFACE / CONTENT DEFERRED";
      position: absolute;
      left: 620px;
      top: 540px;
      display: grid;
      place-items: center;
      color: rgb(222 235 233 / 35%);
      font-size: .58rem;
      font-weight: 900;
      letter-spacing: .08em;
      white-space: nowrap;
    }
    .port { position: absolute; width: 24px; height: 24px; border: 2px solid #f0cfad; background: var(--orange); }
    .port.source { left: 380px; top: 230px; }
    .port.sink { left: 1380px; top: 890px; background: var(--green); border-color: #c2e3d5; }
    .ghost-path { position: absolute; left: 420px; top: 310px; width: 820px; height: 550px; border-left: 3px solid rgb(225 145 89 / 45%); border-bottom: 3px solid rgb(225 145 89 / 45%); transform: skewX(-20deg); }
    .palette-tether {
      position: absolute;
      z-index: 3;
      left: -18px;
      top: 50%;
      width: 18px;
      height: 34px;
      display: none;
      place-items: center;
      padding: 0 2px 0 5px;
      border: 0;
      color: white;
      background: var(--orange);
      clip-path: polygon(100% 0, 0 50%, 100% 100%);
      transform: translateY(-50%);
      cursor: pointer;
      font-size: .4rem;
      font-weight: 900;
    }
    [data-palette-side="right"] .palette-tether {
      right: -18px;
      left: auto;
      padding: 0 5px 0 2px;
      clip-path: polygon(0 0, 100% 50%, 0 100%);
    }
    [data-palette-docked="false"] .palette-tether { display: grid; }
    .palette-tether:hover { background: #e1844e; }
    .detached-palette { height: 100%; min-height: 0; padding: 9px; overflow: auto; background: #d4d5cc; }
    .palette-link { color: var(--ink-soft); font-size: .44rem; }

    .pdf-viewer { height: 100%; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); background: #252d30; }
    .pdf-viewer .app-toolbar { min-width: 0; gap: 4px; }
    .pdf-file-input { display: none; }
    .pdf-file-name { min-width: 28px; flex: 1; overflow: hidden; color: #4f5c5d; font-size: .42rem; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .pdf-page-readout { flex: 0 0 auto; color: #4f5c5d; font-size: .42rem; font-weight: 900; white-space: nowrap; }
    .pdf-stage { position: relative; min-height: 0; overflow: auto; padding: 8px; background: #343d40; }
    .pdf-canvas-wrap { min-width: 100%; min-height: 100%; display: flex; align-items: flex-start; justify-content: center; }
    .pdf-canvas { max-width: none; display: block; background: white; box-shadow: 0 4px 0 rgb(0 0 0 / 20%); }
    .pdf-status { position: absolute; inset: 0; display: grid; place-items: center; padding: 18px; color: #d9dfdc; background: #343d40; font-size: .5rem; font-weight: 800; letter-spacing: .05em; text-align: center; }
    .pdf-status[hidden] { display: none; }
    .pdf-open-external { color: inherit; text-decoration: none; }

    .contracts-app { height: 100%; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); background: #e8ece7; }
    .contract-catalog,
    .contract-detail { min-height: 0; overflow: auto; padding: 10px; }
    .contract-catalog[hidden],
    .contract-detail[hidden] { display: none; }
    .contract-list-label { margin: 0 0 7px; color: var(--ink-soft); font-size: .42rem; font-weight: 900; letter-spacing: .09em; }
    .contract-card {
      width: 100%;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: stretch;
      gap: 8px;
      padding: 0;
      border: 1px solid #6c7a72;
      background: #f4f3e9;
      color: var(--ink);
      cursor: pointer;
      text-align: left;
    }
    .contract-card:hover,
    .contract-card:focus-visible { outline: 2px solid var(--orange); outline-offset: 1px; }
    .contract-card-code { min-width: 54px; display: grid; place-items: center; padding: 8px 6px; color: white; background: var(--green); font-size: .55rem; font-weight: 900; }
    .contract-card-copy { min-width: 0; padding: 7px 0; }
    .contract-card-copy strong { display: block; overflow: hidden; font-size: .56rem; text-overflow: ellipsis; white-space: nowrap; }
    .contract-card-copy small { display: block; margin-top: 3px; color: var(--ink-soft); font-size: .42rem; line-height: 1.35; }
    .contract-card-open { display: grid; place-items: center; padding: 0 9px; border-left: 1px solid #a5afa9; color: var(--green); font-size: .75rem; font-weight: 900; }
    .contract-id { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .contract-number { padding: 4px 6px; color: white; background: var(--green); font-size: .52rem; font-weight: 900; }
    .contract-title { font-size: .67rem; font-weight: 900; }
    .contract-copy { margin: 0 0 9px; color: var(--ink-soft); font-size: .49rem; line-height: 1.45; }
    .contract-limits { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 0 0 6px; border: 2px solid var(--orange); }
    .contract-limit { min-width: 0; padding: 7px; border-right: 1px solid #a8b0ab; background: #f4f3e9; }
    .contract-limit:last-child { border-right: 0; }
    .contract-limit dt { margin: 0 0 3px; color: var(--orange); font-size: .4rem; font-weight: 900; letter-spacing: .08em; }
    .contract-limit dd { margin: 0; font-size: .67rem; font-weight: 900; line-height: 1.2; }
    .contract-reward { margin: -6px 0 6px; padding: 6px 7px; border: 2px solid var(--orange); border-top: 0; background: #f4f3e9; }
    .contract-reward dt { margin: 0 0 3px; color: var(--orange); font-size: .4rem; font-weight: 900; letter-spacing: .08em; }
    .contract-reward dd { margin: 0; font-size: .57rem; font-weight: 900; line-height: 1.2; }
    .contract-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 0 0 9px; border: 1px solid #859089; }
    .contract-fact { min-width: 0; padding: 6px; border-right: 1px solid #a8b0ab; background: #f4f3e9; }
    .contract-fact:last-child { border-right: 0; }
    .contract-fact dt { margin: 0 0 3px; color: var(--green); font-size: .39rem; font-weight: 900; letter-spacing: .08em; }
    .contract-fact dd { margin: 0; font-size: .45rem; font-weight: 800; line-height: 1.3; }
    .contract-package { margin-bottom: 8px; padding: 7px; border-left: 4px solid var(--orange); background: #dce2dc; }
    .contract-package strong { display: block; margin-bottom: 4px; font-size: .45rem; }
    .contract-package span { display: block; color: var(--ink-soft); font-size: .42rem; line-height: 1.45; }
    .contract-actions { display: flex; align-items: center; gap: 7px; }
    .contract-download { display: inline-flex; align-items: center; min-height: 24px; color: inherit; text-decoration: none; }
    .contract-status { color: var(--ink-soft); font-size: .4rem; font-weight: 800; }
    @media (max-width: 640px) {
      .contract-limits { grid-template-columns: 1fr; }
      .contract-limit { border-right: 0; border-bottom: 1px solid #a8b0ab; }
      .contract-limit:last-child { border-bottom: 0; }
      .contract-facts { grid-template-columns: 1fr; }
      .contract-fact { border-right: 0; border-bottom: 1px solid #a8b0ab; }
      .contract-fact:last-child { border-bottom: 0; }
    }

    .trace-view { min-height: 100%; padding: 9px; background: #222f35; color: #d8e0de; }
    .trace-row { display: grid; grid-template-columns: 38px 1fr 42px; align-items: center; gap: 7px; margin: 0 0 5px; font-size: .43rem; }
    .trace-track { height: 9px; border: 1px solid #61747a; background: #17242a; }
    .trace-fill { height: 100%; background: #d0713c; }
    .trace-row:nth-child(2n) .trace-fill { background: #538b7c; }
    .trace-alert { margin-top: 9px; padding: 7px; border: 1px solid #be7655; background: rgb(155 61 39 / 19%); color: #f0b28f; font-size: .47rem; line-height: 1.45; }

    .notes-view { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); background: #ece9be; }
    .notes-strip { padding: 6px 8px; border-bottom: 1px solid #8e8a5e; color: #686231; font-size: .46rem; }
    .notes-area { width: 100%; height: 100%; min-height: 110px; resize: none; padding: 10px; border: 0; background: transparent; color: #39371f; font-size: .55rem; line-height: 1.6; }

    .archive-view { min-height: 100%; padding: 9px; background: #e5e6e1; }
    .snapshot-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 7px; padding: 7px 4px; border-bottom: 1px solid #a5aaa4; font-size: .46rem; }
    .snapshot-icon { width: 26px; height: 24px; display: grid; place-items: center; border: 1px solid #5c696b; background: #d4d8da; font-weight: 900; }
    .snapshot-row strong { display: block; font-size: .49rem; }
    .snapshot-row small { color: var(--ink-soft); font-size: .42rem; }
    .snapshot-row button { padding: 3px 5px; border: 1px solid #687473; background: #f1f0e8; font-size: .42rem; }

    .files-app { height: 100%; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); background: #e8e4d7; }
    .files-toolbar { flex-wrap: wrap; }
    .files-path { min-width: 0; display: flex; align-items: center; gap: 2px; overflow: hidden; }
    .files-crumb {
      min-height: 20px;
      padding: 2px 5px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-soft);
      cursor: pointer;
      font-size: .44rem;
      font-weight: 800;
      white-space: nowrap;
    }
    .files-crumb:hover,
    .files-crumb.drop-target { border-color: #7a806f; background: #f4f1e5; }
    .files-crumb + .files-crumb::before { content: "/"; margin-right: 5px; color: #8c8a7f; }
    .files-view { min-height: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr); overflow: hidden; }
    .file-create {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 8px;
      border-bottom: 1px solid #aaa493;
      background: #ddd7c7;
    }
    .file-create[hidden] { display: none; }
    .file-create input {
      min-width: 0;
      flex: 1;
      height: 24px;
      padding: 3px 6px;
      border: 1px solid #6f766d;
      background: #f7f3e6;
      color: var(--ink);
      font-size: .49rem;
    }
    .file-create button { height: 24px; padding: 0 7px; border: 1px solid #6f766d; background: #f1eee3; font-size: .44rem; font-weight: 800; }
    .files-hint { padding: 5px 8px; border-bottom: 1px solid #b7b1a0; color: var(--ink-soft); font-size: .42rem; letter-spacing: .025em; }
    .file-grid {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
      grid-auto-rows: min-content;
      gap: 7px;
      padding: 9px;
      overflow: auto;
      align-content: start;
    }
    .file-entry {
      min-width: 0;
      min-height: 72px;
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      grid-template-rows: auto auto;
      align-content: center;
      column-gap: 7px;
      padding: 7px;
      border: 1px solid #8d8a7e;
      background: #f0ede3;
      cursor: default;
      text-align: left;
    }
    .file-entry:hover { border-color: #4b6063; background: #f8f6ed; }
    .file-entry.selected { border-color: var(--orange); box-shadow: 0 0 0 1px var(--orange) inset; }
    .file-entry.drop-target { color: white; border-color: var(--navy); background: var(--navy-2); }
    .file-symbol {
      grid-row: 1 / 3;
      width: 30px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid #5d6868;
      background: #ddd8c8;
      font-size: .43rem;
      font-weight: 900;
    }
    .file-entry[data-file-type="folder"] .file-symbol { border-top: 6px solid #9d8742; background: #d8c98f; }
    .file-entry strong { min-width: 0; overflow: hidden; font-size: .48rem; line-height: 1.2; text-overflow: ellipsis; white-space: nowrap; }
    .file-entry small { color: var(--ink-soft); font-size: .4rem; line-height: 1.2; }
    .file-empty { grid-column: 1 / -1; padding: 24px 8px; color: #77766f; font-size: .49rem; text-align: center; }

    .toast {
      position: absolute;
      z-index: 10000;
      right: 12px;
      bottom: 12px;
      max-width: 300px;
      padding: 8px 10px;
      color: white;
      border: 1px solid #071b23;
      background: var(--navy);
      box-shadow: 4px 4px 0 rgb(10 27 33 / 28%);
      font-size: .5rem;
      line-height: 1.4;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 120ms linear, transform 120ms linear;
      pointer-events: none;
    }
    .toast.visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 900px) {
      :root { --dock: 64px; }
      .launch-button { width: 50px; min-height: 55px; }
      .minimized-button { width: 50px; grid-template-columns: 1fr; justify-items: center; }
      .minimized-name { display: none; }
      .launch-name { max-width: 50px; }
      .system-context { display: none; }
    }

    @media (max-width: 620px) {
      :root { --topbar: 34px; --dock: 52px; }
      .system-title { font-size: .56rem; }
      .system-status span:last-child { display: none; }
      .launcher { padding: 5px 3px; }
      .launcher-label { display: none; }
      .launch-button { width: 44px; min-height: 48px; margin-bottom: 3px; }
      .launch-icon { width: 25px; height: 25px; }
      .launch-name { display: none; }
      .minimized-tray { margin-top: 5px; padding-top: 5px; }
      .minimized-button { width: 44px; min-height: 34px; }
      .app-window { min-width: 230px; }
    }
  </style>
</head>
<body>
  <main class="workstation">
    <header class="system-bar">
      <div class="hcw-mark">HC</div>
      <div class="system-title">HENRY CONTROL WORKS</div>

      <div class="system-status"><i class="status-dot"></i><span>LOCAL SESSION</span><span id="clock">00:00:00</span></div>

    <section class="desktop-region">
      <nav class="launcher" aria-label="Applications">
        <div class="launcher-label">OPEN</div>
        <button class="launch-button" data-app="designer" title="Open Designer"><span class="launch-icon">DS</span><span class="launch-name">DESIGNER</span></button>
        <button class="launch-button" data-app="manual" title="Open Component Manual"><span class="launch-icon">MN</span><span class="launch-name">MANUAL</span></button>
        <button class="launch-button" data-app="contract" title="Open Contract"><span class="launch-icon">CT</span><span class="launch-name">CONTRACT</span></button>
        <button class="launch-button" data-app="trace" title="Open Test Trace"><span class="launch-icon">TR</span><span class="launch-name">TRACE</span></button>
        <button class="launch-button" data-app="notes" title="Open Notes"><span class="launch-icon">NT</span><span class="launch-name">NOTES</span></button>
        <button class="launch-button" data-app="files" title="Open Files"><span class="launch-icon">FL</span><span class="launch-name">FILES</span></button>
        <button class="launch-button" data-app="archive" title="Open Workspace Archive"><span class="launch-icon">AR</span><span class="launch-name">ARCHIVE</span></button>
        <div class="minimized-tray" id="minimized-tray" hidden>
          <div class="launcher-label">MINIMIZED</div>
          <div class="minimized-list" id="minimized-list"></div>
        </div>
      </nav>

      <div class="desktop-plane" id="desktop" aria-label="Movable application workspace">
        <div class="desktop-stamp">WINDOW LAYOUT PROTOTYPE<strong>DESK 03</strong></div>
        <div class="snap-preview" id="snap-preview"></div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>
    </section>

  </main>

  <template id="designer-content">
    <div class="designer-app">
      <div class="app-toolbar designer-toolbar">
        <button class="tool-button selected">SELECT</button>
        <button class="tool-button">PLACE</button>
        <button class="tool-button">WIRE</button>
        <span class="tool-spacer"></span>
        <button class="tool-button" data-designer-action="zoom-out" aria-label="Zoom out">−</button>
        <button class="tool-button" data-designer-action="zoom-in" aria-label="Zoom in">+</button>
        <span class="tool-readout" data-view-readout>100% · 240,140</span>
      </div>
      <div class="designer-layout">
        <aside class="component-rail">
          <div class="rail-heading">
            <div class="rail-label">COMPONENTS</div>
            <button class="detach-button" data-designer-action="detach-palette" aria-label="Detach component palette" title="Detach component palette"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 5v8h8v-3"/><path d="M8 2h5v5M13 2 7 8"/></svg></button>
          </div>
          <button class="component-chip" data-component="falling" aria-label="Sand" title="Sand"><span class="component-cell"></span><span class="component-name">SAND</span></button>
          <button class="component-chip" data-component="fixed" aria-label="Wall" title="Wall"><span class="component-cell wall"></span><span class="component-name">WALL</span></button>
          <button class="component-chip" data-component="input" aria-label="Input" title="Input"><span class="component-cell input"></span><span class="component-name">INPUT</span></button>
          <button class="component-chip" data-component="output" aria-label="Output" title="Output"><span class="component-cell output"></span><span class="component-name">OUTPUT</span></button>
          <button class="component-chip disabled" disabled aria-label="Modifier unavailable" title="Modifier unavailable"><span class="component-cell"></span><span class="component-name">MODIFIER</span></button>
        </aside>
        <button class="palette-tether" data-designer-action="show-palette" aria-label="Show detached component palette" title="Component palette is detached">CP</button>
        <div class="work-grid" tabindex="0" aria-label="Design surface viewport. Use arrow keys to pan">
          <div class="design-world">
            <div class="ghost-path"></div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <template id="palette-content">
    <div class="designer-app">
      <div class="app-toolbar">
        <span class="palette-link" data-palette-link>LINKED TO SYSTEM DESIGNER</span>
        <span class="tool-spacer"></span>
      </div>
      <aside class="detached-palette">
        <div class="rail-label">PLACEABLE COMPONENTS</div>
        <button class="component-chip" data-component="falling" aria-label="Sand" title="Sand"><span class="component-cell"></span><span class="component-name">SAND</span></button>
        <button class="component-chip" data-component="fixed" aria-label="Wall" title="Wall"><span class="component-cell wall"></span><span class="component-name">WALL</span></button>
        <button class="component-chip" data-component="input" aria-label="Input" title="Input"><span class="component-cell input"></span><span class="component-name">INPUT</span></button>
        <button class="component-chip" data-component="output" aria-label="Output" title="Output"><span class="component-cell output"></span><span class="component-name">OUTPUT</span></button>
        <button class="component-chip disabled" disabled aria-label="Modifier unavailable" title="Modifier unavailable"><span class="component-cell"></span><span class="component-name">MODIFIER / UNAVAILABLE</span></button>
      </aside>
      <button class="palette-tether" data-palette-action="dock" aria-label="Dock component palette to System Designer" title="Dock component palette to System Designer">DS</button>
    </div>
  </template>

  <template id="manual-content">
    <div class="pdf-viewer">
      <div class="app-toolbar">
        <input class="pdf-file-input" data-pdf-input type="file" accept="application/pdf,.pdf">
        <button class="tool-button" data-pdf-action="open" type="button">OPEN PDF</button>
        <span class="pdf-file-name" data-pdf-name title="HCW-7 EXPANDED OPERATOR PROGRAMMING REFERENCE.PDF">HCW-7 EXPANDED OPERATOR PROGRAMMING REFERENCE.PDF</span>
        <button class="tool-button" data-pdf-action="previous" type="button" aria-label="Previous PDF page">◀</button>
        <span class="pdf-page-readout" data-pdf-page>1 / –</span>
        <button class="tool-button" data-pdf-action="next" type="button" aria-label="Next PDF page">▶</button>
        <button class="tool-button" data-pdf-action="zoom-out" type="button" aria-label="Zoom PDF out">−</button>
        <button class="tool-button" data-pdf-action="zoom-in" type="button" aria-label="Zoom PDF in">+</button>

      </div>

        <div class="pdf-canvas-wrap"><canvas class="pdf-canvas" data-pdf-canvas aria-label="Rendered PDF page"></canvas></div>

  <template id="contract-content">

      <div class="trace-row"><span>000–120</span><div class="trace-track"><div class="trace-fill" style="width:92%"></div></div><span>23 CELLS</span></div>

Compare variant B after the next test.</textarea>

  <script>
    (() => {
      const desktop = document.querySelector('#desktop');
      const taskList = document.querySelector('#task-list');
      const minimizedTray = document.querySelector('#minimized-tray');
      const minimizedList = document.querySelector('#minimized-list');
      const snapPreview = document.querySelector('#snap-preview');
      const toast = document.querySelector('#toast');
      const saveIndicator = document.querySelector('#save-indicator');
      const STORAGE_KEY = 'hcw-workspace-layout-v3';
      const GRID = 9;
      const DESIGN_WORLD = { width: 1800, height: 1200 };
      const ZOOM_LEVELS = [0.5, 0.75, 1, 1.25, 1.5, 2];
      const PALETTE_DOCK_GAP = 0;
      const DEFAULT_MANUAL_PDF = 'HCW-7-Expanded-Operator-Programming-Reference.pdf';
      const CONTRACTS = Object.freeze([
        Object.freeze({
          id: 'hc-001',
          code: 'HC-001',
          title: 'GRAVITY FEED CALIBRATION',
          summary: 'Route Sand from the fixed Input at top left to the fixed Output at top right, then let the system drain.',
          maxCost: '$30',
          maxSize: '20 × 20',
          reward: 'NONE',
          ports: 'FIXED',
          test: '500 ON + 500 OFF',
          difficulty: 'ORIENTATION',
          folderName: 'GRAVITY FEED CALIBRATION CONTRACT',
          archiveAsset: 'contracts/GRAVITY-FEED-CALIBRATION-CONTRACT.zip',
          archiveName: 'GRAVITY FEED CALIBRATION CONTRACT.zip',
          packageNote: 'The tester reports efficiency (Sand out / Sand in), speed (Sand out / turns elapsed), price, and the bounding area of the whole machine including the fixed Input and Output.',
          files: Object.freeze([
            Object.freeze({ name: 'MATERIALS.PDF', kind: 'PDF', asset: 'contracts/HC-001-MATERIALS.pdf' }),
            Object.freeze({ name: 'REQUIREMENTS.PDF', kind: 'PDF', asset: 'contracts/HC-001-REQUIREMENTS.pdf' }),
            Object.freeze({ name: 'GRAVITY FEED CALIBRATION.HCW', kind: 'DESIGN', asset: 'contracts/GRAVITY-FEED-CALIBRATION.HCW' }),
          ]),
        }),
      ]);
      let zCounter = 20;
      let activeId = null;
      let toastTimer = null;
      const listeners = new Map();
      const manualPdfRuntime = new Map();
      if (window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';

      const apps = {
        designer: { code: 'DS', title: 'SYSTEM DESIGNER', subtitle: 'UNSAVED DESIGN / ROUTE A', template: 'designer-content', x: 34, y: 28, w: 690, h: 510, minW: 430, minH: 310 },
        manual: { code: 'MN', title: 'COMPONENT MANUAL', subtitle: 'REFERENCE 7-C', template: 'manual-content', x: 750, y: 44, w: 390, h: 390, minW: 300, minH: 260 },

      const instanceCounters = Object.fromEntries(Object.keys(apps).map((id) => [id, 1]));

      function defaultFilesData() {
        return {
          currentFolderId: 'root',

            { id: 'root', type: 'folder', name: 'DESK 03', parentId: null },
            { id: 'designs', type: 'folder', name: 'DESIGNS', parentId: 'root' },
