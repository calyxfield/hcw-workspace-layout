            { id: 'hc-001', type: 'file', kind: 'CONTRACT', name: 'HC-001.CONTRACT', parentId: 'research' },
          ],
        };
      }

      function createWindowState(appId, instance = 1, offset = 0) {
        const app = apps[appId];
        const data = appId === 'designer'
          ? { view: { x: 240, y: 140, zoom: 1 }, paletteDetached: true, paletteDocked: true, paletteDockSide: 'left', paletteId: null, selectedComponent: 'falling' }
          : appId === 'palette'
            ? { ownerId: null }
            : appId === 'files'
              ? defaultFilesData()
              : appId === 'contract'
                ? { selectedContractId: null }
              : appId === 'manual'
                ? { pdfName: 'HCW-7 EXPANDED OPERATOR PROGRAMMING REFERENCE.PDF' }
              : {};
        return {
          appId,
          instance,
          open: false,
          minimized: false,
          maximized: false,
          pinned: appId === 'designer' && instance === 1,
          x: app.x + offset,
          y: app.y + offset,
          w: app.w,
          h: app.h,
          z: 1,
          restore: null,
          data,
        };
      }

      const state = Object.fromEntries(Object.keys(apps).map((id) => [id, createWindowState(id)]));

      function appFor(id) { return apps[state[id]?.appId]; }
      function windowTitle(id) {
        const item = state[id];
        const app = appFor(id);
        return item.instance > 1 ? `${app.title} ${String(item.instance).padStart(2, '0')}` : app.title;
      }
      function windowCode(id) {
        const item = state[id];
        const app = appFor(id);
        return item.instance > 1 ? `${app.code}${item.instance}` : app.code;
      }

      function planeSize() {
        const rect = desktop.getBoundingClientRect();
        return { width: rect.width, height: rect.height };
      }

      function snap(value) { return Math.round(value / GRID) * GRID; }
      function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }

      function clampRect(id, rect) {
        const size = planeSize();
        const app = appFor(id);
        const baseMinW = Math.min(app.minW, size.width);
        const minW = state[id]?.appId === 'designer' && size.width < app.minW + 18
          ? Math.min(size.width, Math.max(230, size.width - 18))
          : baseMinW;
        const w = clamp(rect.w, minW, Math.max(minW, size.width));
        const h = clamp(rect.h, Math.min(app.minH, size.height), Math.max(Math.min(app.minH, size.height), size.height));
        return {
          x: clamp(rect.x, 0, Math.max(0, size.width - w)),
          y: clamp(rect.y, 0, Math.max(0, size.height - h)),
          w,
          h,
        };
      }

      function clampDockedDesignerRect(id, rect) {
        const next = clampRect(id, rect);
        if (state[id]?.appId !== 'designer') return next;
        const data = normalizeDesignerData(id);
        const palette = data.paletteId ? state[data.paletteId] : null;
        if (!data.paletteDocked || !palette?.open || palette.minimized) return next;
        const size = planeSize();
        const paletteSpan = palette.w + PALETTE_DOCK_GAP;
        if (next.w + paletteSpan > size.width) return next;
        if (data.paletteDockSide === 'left') {
          next.x = clamp(next.x, paletteSpan, size.width - next.w);
        } else {
          next.x = clamp(next.x, 0, size.width - next.w - paletteSpan);
        }
        return next;
      }

      function setRect(id, rect, options = {}) {
        const next = state[id]?.appId === 'designer' ? clampDockedDesignerRect(id, rect) : clampRect(id, rect);
        Object.assign(state[id], next);
        const element = document.querySelector(`[data-window="${id}"]`);
        if (!element) return;
        element.style.left = `${next.x}px`;
        element.style.top = `${next.y}px`;
        element.style.width = `${next.w}px`;
        element.style.height = `${next.h}px`;
        if (state[id]?.appId === 'designer') {
          renderDesigner(id);
          if (!options.skipDock && normalizeDesignerData(id).paletteDocked) positionDockedPalette(id);
        }
        if (state[id]?.appId === 'palette') {
          const ownerId = state[id].data?.ownerId;
          if (ownerId) renderPaletteLink(ownerId);
        }
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('visible'), 1800);
      }

      function publish(topic, payload = {}, source = 'workspace') {
        const detail = { topic, payload, source, time: Date.now() };
        desktop.dispatchEvent(new CustomEvent('workspace-message', { detail }));
        for (const callback of listeners.get(topic) || []) callback(detail);
        return detail;
      }

      function subscribe(topic, callback) {
        if (!listeners.has(topic)) listeners.set(topic, new Set());
        listeners.get(topic).add(callback);
        return () => listeners.get(topic)?.delete(callback);
      }

      function joinedWindowIds(id) {
        const item = state[id];
        if (!item) return [id];
        const designerId = item.appId === 'designer' ? id : item.appId === 'palette' ? item.data?.ownerId : null;
        if (!designerId || !state[designerId]) return [id];
        const data = normalizeDesignerData(designerId);
        const paletteId = data.paletteId;
        const palette = paletteId ? state[paletteId] : null;
        const joined = data.paletteDocked && state[designerId].open && !state[designerId].minimized && palette?.open && !palette.minimized;
        return joined ? [designerId, paletteId] : [id];
      }

      function focusWindow(id) {
        if (!state[id]?.open || state[id].minimized) return;
        activeId = id;
        zCounter += 1;
        const activeIds = new Set(joinedWindowIds(id));
        activeIds.forEach((windowId) => { state[windowId].z = zCounter; });
        document.querySelectorAll('.app-window').forEach((windowElement) => {
          const windowId = windowElement.dataset.window;
          windowElement.classList.toggle('active', activeIds.has(windowId));
          windowElement.style.zIndex = state[windowId]?.z || 1;
        });
        renderTasks();
      }

      function makeWindow(id) {
        const app = appFor(id);
        const title = windowTitle(id);
        const code = windowCode(id);
        const newWindowControl = app.allowMultiple === false ? '' : `<button class="window-control" data-window-action="new" aria-label="Open another ${app.title} window"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 5v8h8v-3"/><path d="M8 2h5v5M13 2 7 8"/></svg></button>`;
        const element = document.createElement('section');
        element.className = 'app-window';
        element.dataset.window = id;
        element.dataset.app = state[id].appId;
        element.setAttribute('role', 'dialog');
        element.setAttribute('aria-label', title);
        element.innerHTML = `
          <header class="titlebar">
            <span class="window-code">${code}</span>
            <span class="window-heading"><strong>${title}</strong><small>${app.subtitle}</small></span>
            <span class="window-controls">
              <button class="window-control pin" data-window-action="pin" aria-label="Pin ${title}" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 1h6l-1 4 2 2v1H9v5l-1 2-1-2V8H4V7l2-2z"/></svg></button>
              <button class="window-control" data-window-action="minimize" aria-label="Minimize ${title}">_</button>
              <button class="window-control" data-window-action="shrink" aria-label="Shrink ${title} to minimum size" title="Shrink to minimum size"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2l5 5M7 3v4H3M14 14l-5-5M9 13V9h4"/></svg></button>
              ${newWindowControl}
              <button class="window-control close" data-window-action="close" aria-label="Close ${title}">×</button>
            </span>
          </header>
          <div class="window-body"></div>
          <footer class="window-footer"><span>${code} APPLICATION</span><span>READY</span></footer>
          <div class="resize-handle" data-resize="w" aria-hidden="true"></div>
          <div class="resize-handle" data-resize="e" aria-hidden="true"></div>
          <div class="resize-handle" data-resize="s" aria-hidden="true"></div>
          <div class="resize-handle" data-resize="sw" aria-hidden="true"></div>
          <div class="resize-handle" data-resize="se" aria-hidden="true"></div>`;
        const template = document.querySelector(`#${app.template}`);
        element.querySelector('.window-body').append(template.content.cloneNode(true));
        desktop.append(element);

        element.addEventListener('pointerdown', () => focusWindow(id));
        element.querySelectorAll('[data-window-action]').forEach((button) => {
          button.addEventListener('click', (event) => {
            event.stopPropagation();
            const action = button.dataset.windowAction;
            if (action === 'minimize') minimizeWindow(id);
            if (action === 'shrink') shrinkWindow(id);
            if (action === 'pin') togglePin(id);
            if (action === 'new') newWindow(id);
            if (action === 'close') closeWindow(id);
          });
        });
        element.querySelectorAll('[data-action="save-layout"]').forEach((button) => button.addEventListener('click', saveLayout));
        installDrag(id, element);
        installResize(id, element);
        initializeApp(id, element);
        return element;
      }

      function normalizeDesignerData(id) {
        if (!state[id]?.data) state[id].data = {};
        const data = state[id].data;
        data.view = { x: 240, y: 140, zoom: 1, ...(data.view || {}) };
        data.paletteDetached = true;
        data.paletteDocked = data.paletteDocked !== false;
        data.paletteDockSide = data.paletteDockSide === 'right' ? 'right' : 'left';
        data.paletteId = data.paletteId || null;
        data.selectedComponent = data.selectedComponent || 'falling';
        return data;
      }

      function renderPaletteLink(designerId) {
        const owner = state[designerId];
        if (!owner || owner.appId !== 'designer') return;
        const data = normalizeDesignerData(designerId);
        const palette = data.paletteId ? state[data.paletteId] : null;
        const ownerElement = document.querySelector(`[data-window="${designerId}"]`);
        const paletteElement = data.paletteId ? document.querySelector(`[data-window="${data.paletteId}"]`) : null;
        const joined = Boolean(data.paletteDocked && owner.open && !owner.minimized && palette?.open && !palette.minimized);
        let ownerSide = data.paletteDockSide;
        if (!joined && palette?.open && !palette.minimized) {
          ownerSide = palette.x + palette.w / 2 < owner.x + owner.w / 2 ? 'left' : 'right';
          data.paletteDockSide = ownerSide;
        }
        const paletteSide = ownerSide === 'left' ? 'right' : 'left';
        if (ownerElement) {
          ownerElement.dataset.paletteDocked = String(joined);
          ownerElement.dataset.paletteSide = ownerSide;
          const tether = ownerElement.querySelector('.palette-tether');
          if (tether) {
            const label = !palette?.open || palette.minimized ? 'Restore and dock component palette' : 'Dock component palette';
            tether.title = label;
            tether.setAttribute('aria-label', label);
          }
        }
        if (paletteElement) {
          paletteElement.dataset.paletteDocked = String(joined);
          paletteElement.dataset.paletteSide = paletteSide;
          const tether = paletteElement.querySelector('.palette-tether');
          if (tether) {
            tether.title = `Dock to ${windowTitle(designerId)}`;
            tether.setAttribute('aria-label', tether.title);
          }
        }
      }

      function renderDesigner(id) {
        if (state[id]?.appId !== 'designer') return;
        const data = normalizeDesignerData(id);
        const element = document.querySelector(`[data-window="${id}"]`);
        if (!element) return;
        const layout = element.querySelector('.designer-layout');
        const viewport = element.querySelector('.work-grid');
        const world = element.querySelector('.design-world');
        layout?.classList.toggle('palette-detached', data.paletteDetached);
        element.querySelectorAll('[data-component]').forEach((button) => button.classList.toggle('selected', button.dataset.component === data.selectedComponent));
        if (!viewport || !world) return;
        const zoom = clamp(Number(data.view.zoom) || 1, ZOOM_LEVELS[0], ZOOM_LEVELS.at(-1));
        data.view.zoom = zoom;
        const maxX = Math.max(0, DESIGN_WORLD.width - viewport.clientWidth / zoom);
        const maxY = Math.max(0, DESIGN_WORLD.height - viewport.clientHeight / zoom);
        data.view.x = clamp(Number(data.view.x) || 0, 0, maxX);
        data.view.y = clamp(Number(data.view.y) || 0, 0, maxY);
        world.style.transform = `translate(${-data.view.x * zoom}px, ${-data.view.y * zoom}px) scale(${zoom})`;
        element.dataset.viewX = String(Math.round(data.view.x));
        element.dataset.viewY = String(Math.round(data.view.y));
        element.dataset.viewZoom = String(zoom);
        const readout = element.querySelector('[data-view-readout]');
        if (readout) readout.textContent = `${Math.round(zoom * 100)}% · ${Math.round(data.view.x)},${Math.round(data.view.y)}`;
        renderPaletteLink(id);
      }

      function panDesigner(id, dx, dy) {
        const data = normalizeDesignerData(id);
        data.view.x += dx / data.view.zoom;
        data.view.y += dy / data.view.zoom;
        renderDesigner(id);
        publish('designer:panned', { id, view: { ...data.view } }, id);
      }

      function zoomDesigner(id, direction) {
        const data = normalizeDesignerData(id);
        const currentIndex = ZOOM_LEVELS.reduce((best, value, index) => Math.abs(value - data.view.zoom) < Math.abs(ZOOM_LEVELS[best] - data.view.zoom) ? index : best, 0);
        const nextIndex = clamp(currentIndex + direction, 0, ZOOM_LEVELS.length - 1);
        const nextZoom = ZOOM_LEVELS[nextIndex];
        if (nextZoom === data.view.zoom) return;
        const viewport = document.querySelector(`[data-window="${id}"] .work-grid`);
        const width = viewport?.clientWidth || 0;
        const height = viewport?.clientHeight || 0;
        const centerX = data.view.x + width / (2 * data.view.zoom);
        const centerY = data.view.y + height / (2 * data.view.zoom);
        data.view.zoom = nextZoom;
        data.view.x = centerX - width / (2 * nextZoom);
        data.view.y = centerY - height / (2 * nextZoom);
        renderDesigner(id);
        publish('designer:zoomed', { id, view: { ...data.view } }, id);
      }

      function paletteIdForDesigner(designerId) {
        const data = normalizeDesignerData(designerId);
        if (data.paletteId) return data.paletteId;
        const paletteId = state[designerId].instance === 1 ? 'palette' : `palette-${state[designerId].instance}`;
        if (!state[paletteId]) state[paletteId] = createWindowState('palette', state[designerId].instance, 27 * ((state[designerId].instance - 1) % 6));
        state[paletteId].data = { ...(state[paletteId].data || {}), ownerId: designerId };
        instanceCounters.palette = Math.max(instanceCounters.palette || 1, state[designerId].instance);
        data.paletteId = paletteId;
        return paletteId;
      }

      function renderPalette(paletteId) {
        if (state[paletteId]?.appId !== 'palette') return;
        const ownerId = state[paletteId].data?.ownerId;
        const owner = state[ownerId];
        const element = document.querySelector(`[data-window="${paletteId}"]`);
        if (!owner || !element) return;
        const ownerData = normalizeDesignerData(ownerId);
        element.querySelectorAll('[data-component]').forEach((button) => button.classList.toggle('selected', button.dataset.component === ownerData.selectedComponent));
        const link = element.querySelector('[data-palette-link]');
        if (link) link.textContent = `${ownerData.paletteDocked ? 'DOCKED' : 'LINKED'} TO ${windowTitle(ownerId)}`;
        renderPaletteLink(ownerId);
      }

      function selectComponent(designerId, component) {
        if (!['falling', 'fixed'].includes(component)) return;
        const data = normalizeDesignerData(designerId);
        data.selectedComponent = component;
        renderDesigner(designerId);
        if (data.paletteId) renderPalette(data.paletteId);
        publish('designer:component-selected', { id: designerId, component }, designerId);
      }

      function positionDockedPalette(designerId) {
        const data = normalizeDesignerData(designerId);
        const paletteId = paletteIdForDesigner(designerId);
        const owner = state[designerId];
        const palette = state[paletteId];
        if (!data.paletteDocked || !owner?.open || owner.minimized || !palette?.open || palette.minimized) return;
        const fittedOwner = clampDockedDesignerRect(designerId, owner);
        if (fittedOwner.x !== owner.x || fittedOwner.y !== owner.y || fittedOwner.w !== owner.w || fittedOwner.h !== owner.h) {
          setRect(designerId, fittedOwner, { skipDock: true });
        }
        const leftX = owner.x - palette.w - PALETTE_DOCK_GAP;
        const rightX = owner.x + owner.w + PALETTE_DOCK_GAP;
        const side = data.paletteDockSide;
        const x = side === 'left' ? leftX : rightX;
        setRect(paletteId, { x, y: owner.y, w: palette.w, h: palette.h }, { skipDock: true });
        const ownerElement = document.querySelector(`[data-window="${designerId}"]`);
        if (ownerElement) ownerElement.dataset.paletteSide = side;
        renderPalette(paletteId);
      }

      function dockPalette(designerId, options = {}) {
        if (!state[designerId] || state[designerId].appId !== 'designer') return;
        const data = normalizeDesignerData(designerId);
        const paletteId = paletteIdForDesigner(designerId);
        data.paletteDetached = true;
        data.paletteDocked = true;
        if (!state[paletteId].open || state[paletteId].minimized) openWindow(paletteId);
        positionDockedPalette(designerId);
        renderDesigner(designerId);
        if (options.focus !== false) focusWindow(paletteId);
        publish('designer:palette-docked', { id: designerId, paletteId, side: data.paletteDockSide }, designerId);
      }

      function detachPalette(designerId) {
        const data = normalizeDesignerData(designerId);
        const paletteId = paletteIdForDesigner(designerId);
        data.paletteDetached = true;
        data.paletteDocked = false;
        const owner = state[designerId];
        if (!state[paletteId].open) {
          state[paletteId].x = owner.x + Math.min(160, Math.max(30, owner.w - 300));
          state[paletteId].y = owner.y + 80;
        }
        openWindow(paletteId);
        renderDesigner(designerId);
        renderPalette(paletteId);
        publish('designer:palette-detached', { id: designerId, paletteId }, designerId);
      }

      function showPalette(designerId) {
        dockPalette(designerId);
      }

      function normalizeFilesData(id) {
        const defaults = defaultFilesData();
        if (!state[id]?.data || !Array.isArray(state[id].data.nodes)) state[id].data = defaults;
        const data = state[id].data;
        if (!data.nodes.some((node) => node.id === 'root' && node.type === 'folder')) data.nodes.unshift(defaults.nodes[0]);
        const current = data.nodes.find((node) => node.id === data.currentFolderId && node.type === 'folder');
        data.currentFolderId = current ? current.id : 'root';
        if (!data.nodes.some((node) => node.id === data.selectedId)) data.selectedId = null;
        data.nextId = Math.max(1, Number(data.nextId) || 1);
        data.nextFolderNumber = Math.max(1, Number(data.nextFolderNumber) || 1);
        return data;
      }

      function fileNode(data, nodeId) {
        return data.nodes.find((node) => node.id === nodeId) || null;
      }

      function filePath(data, folderId) {
        const path = [];
        let folder = fileNode(data, folderId);
        while (folder) {
          path.unshift(folder);
          folder = folder.parentId ? fileNode(data, folder.parentId) : null;
        }
        return path;
      }

      function folderContains(data, folderId, possibleChildId) {
        let node = fileNode(data, possibleChildId);
        while (node) {
          if (node.id === folderId) return true;
          node = node.parentId ? fileNode(data, node.parentId) : null;
        }
        return false;
      }

      function uniqueFileName(data, parentId, requestedName) {
        const base = requestedName.trim() || 'NEW FOLDER';
        const existing = new Set(data.nodes.filter((node) => node.parentId === parentId).map((node) => node.name.toLocaleLowerCase()));
        if (!existing.has(base.toLocaleLowerCase())) return base;
        let suffix = 2;
        while (existing.has(`${base} ${suffix}`.toLocaleLowerCase())) suffix += 1;
        return `${base} ${suffix}`;
      }

      function openFilesFolder(id, folderId) {
        const data = normalizeFilesData(id);
        const folder = fileNode(data, folderId);
        if (!folder || folder.type !== 'folder') return;
        data.currentFolderId = folder.id;
        data.selectedId = null;
        renderFiles(id);
        publish('files:folder-opened', { id, folderId }, id);
      }

      function moveFileNode(id, nodeId, folderId) {
        const data = normalizeFilesData(id);
        const node = fileNode(data, nodeId);
        const folder = fileNode(data, folderId);
        if (!node || node.id === 'root' || !folder || folder.type !== 'folder') return false;
        if (node.id === folder.id || (node.type === 'folder' && folderContains(data, node.id, folder.id))) {
          showToast('A folder cannot contain itself');
          return false;
        }
        if (node.parentId === folder.id) return false;
        node.parentId = folder.id;
        data.selectedId = null;
        renderFiles(id);
        showToast(`${node.name} moved to ${folder.name}`);
        publish('files:item-moved', { id, nodeId, folderId }, id);
        return true;
      }

      function createFilesFolder(id, requestedName) {
        const data = normalizeFilesData(id);
        const name = uniqueFileName(data, data.currentFolderId, requestedName);
        const folderId = `folder-${data.nextId}`;
        data.nextId += 1;
        data.nextFolderNumber += 1;
        data.nodes.push({ id: folderId, type: 'folder', name, parentId: data.currentFolderId });
        data.selectedId = folderId;
        renderFiles(id);
        showToast(`${name} created`);
        publish('files:folder-created', { id, folderId, name, parentId: data.currentFolderId }, id);
        return folderId;
      }

      function contractById(contractId) {
        return CONTRACTS.find((contract) => contract.id === contractId) || null;
      }

      function normalizeContractData(id) {
        if (!state[id]?.data) state[id].data = {};
        const data = state[id].data;
        if (!contractById(data.selectedContractId)) data.selectedContractId = null;
        return data;
      }

      function renderContract(id) {
        if (state[id]?.appId !== 'contract') return;
        const element = document.querySelector(`[data-window="${id}"]`);
        if (!element) return;
        const data = normalizeContractData(id);
        const selected = contractById(data.selectedContractId);
        const catalog = element.querySelector('[data-contract-catalog]');
        const detail = element.querySelector('[data-contract-detail]');
        const back = element.querySelector('[data-contract-action="back"]');
        const heading = element.querySelector('[data-contract-heading]');
        const status = element.querySelector('[data-contract-status]');
        catalog.hidden = Boolean(selected);
        detail.hidden = !selected;
        back.hidden = !selected;
        heading.textContent = selected ? selected.code : 'CONTRACT BOARD';
        status.textContent = selected && data.lastImportedContractId === selected.id
          ? 'PROJECT FILES ADDED'
          : `${CONTRACTS.length} AVAILABLE`;
        if (!selected) {
          catalog.innerHTML = `
            <p class="contract-list-label">SELECT A CONTRACT TO INSPECT ITS LIMITS, I/O, TEST, AND PROJECT PACKAGE</p>
            ${CONTRACTS.map((contract) => `
              <button class="contract-card" data-contract-id="${contract.id}" type="button">
                <span class="contract-card-code">${contract.code}</span>
                <span class="contract-card-copy"><strong>${contract.title}</strong><small>${contract.maxCost} · ${contract.maxSize} · ${contract.ports} I/O</small></span>
                <span class="contract-card-open" aria-hidden="true">›</span>
              </button>`).join('')}`;
          detail.innerHTML = '';
          return;
        }
        detail.innerHTML = `
          <div class="contract-id"><span class="contract-number">${selected.code}</span><span class="contract-title">${selected.title}</span></div>
          <p class="contract-copy">${selected.summary}</p>
          <dl class="contract-limits">
            <div class="contract-limit"><dt>MAX COST</dt><dd>${selected.maxCost}</dd></div>
            <div class="contract-limit"><dt>MAX SIZE</dt><dd>${selected.maxSize}</dd></div>
          </dl>
          <dl class="contract-reward"><dt>REWARD</dt><dd>${selected.reward}</dd></dl>
          <dl class="contract-facts">
            <div class="contract-fact"><dt>INPUT / OUTPUT</dt><dd>${selected.ports}</dd></div>
            <div class="contract-fact"><dt>TEST</dt><dd>${selected.test}</dd></div>
            <div class="contract-fact"><dt>DIFFICULTY</dt><dd>${selected.difficulty}</dd></div>
          </dl>
          <div class="contract-package">
            <strong>PROJECT PACKAGE</strong>
            <span>MATERIALS.PDF · REQUIREMENTS.PDF · GRAVITY FEED CALIBRATION.HCW</span>
            <span>${selected.packageNote}</span>
          </div>
          <div class="contract-actions">
            <a class="tool-button contract-download" data-contract-action="download" data-contract-id="${selected.id}" href="${selected.archiveAsset}" download="${selected.archiveName}">DOWNLOAD PROJECT FILES</a>
          </div>`;
      }

      function importContractPackage(contract) {
        const filesId = 'files';
        const data = normalizeFilesData(filesId);
        const folderId = `contract-${contract.id}`;
        let folder = fileNode(data, folderId) || data.nodes.find((node) => node.type === 'folder' && node.contractId === contract.id);
        if (!folder) {
          folder = { id: folderId, type: 'folder', name: contract.folderName, parentId: 'root', contractId: contract.id };
          data.nodes.push(folder);
        } else {
          folder.name = contract.folderName;
          folder.parentId = 'root';
          folder.contractId = contract.id;
        }
        contract.files.forEach((file, index) => {
          const fileId = `${contract.id}-package-${index + 1}`;
          const existing = fileNode(data, fileId);
          const value = { id: fileId, type: 'file', parentId: folder.id, contractId: contract.id, ...file };
          if (existing) Object.assign(existing, value);
          else data.nodes.push(value);
        });
        data.currentFolderId = folder.id;
        data.selectedId = null;
        const contractWindow = Object.keys(state).find((windowId) => state[windowId].appId === 'contract' && state[windowId].open);
        if (contractWindow) {
          normalizeContractData(contractWindow).lastImportedContractId = contract.id;
          renderContract(contractWindow);
        }
        openWindow(filesId);
        renderFiles(filesId);
        showToast(`${contract.title} added to Files`);
        publish('contract:package-imported', { contractId: contract.id, folderId: folder.id, files: contract.files.map((file) => file.name) }, contract.id);
        return folder.id;
      }

      async function openStoredFile(node) {
        if (node.kind === 'PDF' && node.asset) {
          openWindow('manual');
          await loadManualPdf('manual', node.asset, node.name);
          showToast(`${node.name} opened`);
          publish('files:pdf-opened', { nodeId: node.id, asset: node.asset }, 'files');
          return;
        }
        if (node.kind === 'DESIGN' && node.asset) {
          openWindow('designer');
          showToast(`${node.name} is the starter save`);
          publish('files:design-selected', { nodeId: node.id, asset: node.asset }, 'files');
          return;
        }
        showToast(`${node.name} is stored here`);
      }

      function initializeContract(id, element) {
        element.addEventListener('click', (event) => {
          const back = event.target.closest('[data-contract-action="back"]');
          if (back) {
            normalizeContractData(id).selectedContractId = null;
            renderContract(id);
            return;
          }
          const download = event.target.closest('[data-contract-action="download"]');
          if (download) {
            const contract = contractById(download.dataset.contractId);
            if (contract) importContractPackage(contract);
            return;
          }
          const card = event.target.closest('.contract-card[data-contract-id]');
          if (!card) return;
          normalizeContractData(id).selectedContractId = card.dataset.contractId;
          renderContract(id);
          publish('contract:selected', { contractId: card.dataset.contractId }, id);
        });
        renderContract(id);
      }

      function renderFiles(id) {
        if (state[id]?.appId !== 'files') return;
        const element = document.querySelector(`[data-window="${id}"]`);
        if (!element) return;
        const data = normalizeFilesData(id);
        const current = fileNode(data, data.currentFolderId);
        const pathElement = element.querySelector('[data-files-path]');
        const grid = element.querySelector('[data-file-grid]');
        const upButton = element.querySelector('[data-files-action="up"]');
        const moveUpButton = element.querySelector('[data-files-action="move-up"]');
        pathElement.innerHTML = '';
        filePath(data, current.id).forEach((folder) => {
          const crumb = document.createElement('button');
          crumb.type = 'button';
          crumb.className = 'files-crumb';
          crumb.dataset.folderId = folder.id;
          crumb.textContent = folder.name;
          crumb.addEventListener('click', () => openFilesFolder(id, folder.id));
          crumb.addEventListener('dragover', (event) => { event.preventDefault(); crumb.classList.add('drop-target'); });
          crumb.addEventListener('dragleave', () => crumb.classList.remove('drop-target'));
          crumb.addEventListener('drop', (event) => {
            event.preventDefault();
            crumb.classList.remove('drop-target');
            moveFileNode(id, event.dataTransfer.getData('text/plain'), folder.id);
          });
          pathElement.append(crumb);
        });
        upButton.disabled = !current.parentId;
        const selected = fileNode(data, data.selectedId);
        moveUpButton.disabled = !selected || !current.parentId;
        grid.innerHTML = '';
        const children = data.nodes
          .filter((node) => node.parentId === current.id)
          .sort((a, b) => (a.type === b.type ? a.name.localeCompare(b.name) : a.type === 'folder' ? -1 : 1));
        if (!children.length) {
          const empty = document.createElement('div');
          empty.className = 'file-empty';
          empty.textContent = 'THIS FOLDER IS EMPTY';
          grid.append(empty);
          return;
        }
        children.forEach((node) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'file-entry';
          button.classList.toggle('selected', data.selectedId === node.id);
          button.dataset.fileId = node.id;
          button.dataset.fileType = node.type;
          button.draggable = true;
          button.setAttribute('role', 'listitem');
          const childCount = node.type === 'folder' ? data.nodes.filter((candidate) => candidate.parentId === node.id).length : null;
          const meta = node.type === 'folder' ? `${childCount} ITEM${childCount === 1 ? '' : 'S'}` : node.kind;
          const symbol = node.type === 'folder' ? 'DIR' : ({ DESIGN: 'DSN', TRACE: 'LOG', MANUAL: 'PDF', PDF: 'PDF', CONTRACT: 'CTR' }[node.kind] || 'DOC');
          const icon = document.createElement('span');
          icon.className = 'file-symbol';
          icon.textContent = symbol;
          const name = document.createElement('strong');
          name.textContent = node.name;
          const details = document.createElement('small');
          details.textContent = meta;
          button.append(icon, name, details);
          button.addEventListener('click', () => {
            data.selectedId = node.id;
            grid.querySelectorAll('.file-entry').forEach((entry) => entry.classList.toggle('selected', entry.dataset.fileId === node.id));
            moveUpButton.disabled = !current.parentId;
          });
          button.addEventListener('dblclick', () => {
            if (node.type === 'folder') openFilesFolder(id, node.id);
            else openStoredFile(node);
          });
          button.addEventListener('dragstart', (event) => {
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', node.id);
          });
          if (node.type === 'folder') {
            button.addEventListener('dragover', (event) => { event.preventDefault(); button.classList.add('drop-target'); });
            button.addEventListener('dragleave', () => button.classList.remove('drop-target'));
            button.addEventListener('drop', (event) => {
              event.preventDefault();
              button.classList.remove('drop-target');
              moveFileNode(id, event.dataTransfer.getData('text/plain'), node.id);
            });
          }
          grid.append(button);
        });
      }

      function initializeFiles(id, element) {
        const form = element.querySelector('[data-file-create]');
        const input = element.querySelector('[data-file-name]');
        const hideCreate = () => { form.hidden = true; input.value = ''; };
        element.querySelector('[data-files-action="new-folder"]')?.addEventListener('click', () => {
          const data = normalizeFilesData(id);
          form.hidden = false;
          input.value = `NEW FOLDER ${String(data.nextFolderNumber).padStart(2, '0')}`;
          input.focus();
          input.select();
        });
        element.querySelector('[data-files-action="cancel-folder"]')?.addEventListener('click', hideCreate);
        element.querySelector('[data-files-action="up"]')?.addEventListener('click', () => {
          const data = normalizeFilesData(id);
          const current = fileNode(data, data.currentFolderId);
          if (current?.parentId) openFilesFolder(id, current.parentId);
        });
        element.querySelector('[data-files-action="move-up"]')?.addEventListener('click', () => {
          const data = normalizeFilesData(id);
          const current = fileNode(data, data.currentFolderId);
          if (current?.parentId && data.selectedId) moveFileNode(id, data.selectedId, current.parentId);
        });
        form?.addEventListener('submit', (event) => {
          event.preventDefault();
          createFilesFolder(id, input.value);
          hideCreate();
        });
        renderFiles(id);
      }

      function initializeApp(id, element) {
        if (state[id].appId === 'designer') {
          element.querySelectorAll('[data-designer-action]').forEach((button) => button.addEventListener('click', () => {
            const action = button.dataset.designerAction;
            if (action === 'zoom-out') zoomDesigner(id, -1);
            if (action === 'zoom-in') zoomDesigner(id, 1);
            if (action === 'detach-palette') detachPalette(id);
            if (action === 'show-palette') showPalette(id);
          }));
          element.querySelectorAll('[data-component]').forEach((button) => button.addEventListener('click', () => selectComponent(id, button.dataset.component)));
          element.querySelector('.work-grid')?.addEventListener('pointerdown', () => focusWindow(id));
          renderDesigner(id);
        }
        if (state[id].appId === 'palette') {
          const ownerId = state[id].data?.ownerId;
          element.querySelector('[data-palette-action="dock"]')?.addEventListener('click', () => dockPalette(ownerId));
          element.querySelectorAll('[data-component]').forEach((button) => button.addEventListener('click', () => selectComponent(ownerId, button.dataset.component)));
          renderPalette(id);
        }
        if (state[id].appId === 'files') initializeFiles(id, element);
        if (state[id].appId === 'contract') initializeContract(id, element);
        if (state[id].appId === 'manual') initializeManual(id, element);
      }

      async function renderManualPdf(id) {
        const runtime = manualPdfRuntime.get(id);
        if (!runtime?.document || !runtime.element.isConnected || runtime.element.hidden) return;
        const stage = runtime.element.querySelector('.pdf-stage');
        const canvas = runtime.element.querySelector('[data-pdf-canvas]');
        const readout = runtime.element.querySelector('[data-pdf-page]');
        const status = runtime.element.querySelector('[data-pdf-status]');
        if (!stage || stage.clientWidth < 40) return;
        const page = await runtime.document.getPage(runtime.page);
        const baseViewport = page.getViewport({ scale: 1 });
        const fitScale = Math.max(.2, (stage.clientWidth - 18) / baseViewport.width);
        const viewport = page.getViewport({ scale: fitScale * runtime.zoom });
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.ceil(viewport.width * pixelRatio);
        canvas.height = Math.ceil(viewport.height * pixelRatio);
        canvas.style.width = `${viewport.width}px`;
        canvas.style.height = `${viewport.height}px`;
        const context = canvas.getContext('2d', { alpha: false });
        runtime.renderTask?.cancel();
        runtime.renderTask = page.render({
          canvasContext: context,
          viewport,
          transform: pixelRatio === 1 ? null : [pixelRatio, 0, 0, pixelRatio, 0, 0],
        });
        try {
          await runtime.renderTask.promise;
          status.hidden = true;
          readout.textContent = `${runtime.page} / ${runtime.document.numPages}`;
        } catch (error) {
          if (error?.name !== 'RenderingCancelledException') throw error;
        } finally {
          runtime.renderTask = null;
        }
      }

      async function loadManualPdf(id, source, fileName, options = {}) {
        const runtime = manualPdfRuntime.get(id);
        if (!runtime) return;
        const status = runtime.element.querySelector('[data-pdf-status]');
        const name = runtime.element.querySelector('[data-pdf-name]');
        const external = runtime.element.querySelector('[data-pdf-external]');
        const loadVersion = ++runtime.loadVersion;
        status.hidden = false;
        status.textContent = 'LOADING PDF';
        runtime.renderTask?.cancel();
        if (runtime.document) await runtime.document.destroy();
        if (runtime.objectUrl && runtime.objectUrl !== options.objectUrl) URL.revokeObjectURL(runtime.objectUrl);
        runtime.document = null;
        runtime.objectUrl = options.objectUrl || null;
        try {
          if (!window.pdfjsLib) throw new Error('PDF renderer unavailable');
          const loadingTask = window.pdfjsLib.getDocument(options.data ? { data: options.data } : source);
          const document = await loadingTask.promise;
          if (loadVersion !== runtime.loadVersion) {
            await document.destroy();
            return;
          }
          runtime.document = document;
          runtime.page = 1;
          runtime.zoom = 1;
          const displayName = fileName.toUpperCase();
          state[id].data = { ...(state[id].data || {}), pdfName: displayName };
          name.textContent = displayName;
          name.title = displayName;
          external.href = options.objectUrl || source;
          await renderManualPdf(id);
        } catch (error) {
          if (loadVersion !== runtime.loadVersion) return;
          status.hidden = false;
          status.textContent = 'PDF COULD NOT BE OPENED';
          console.error(error);
        }
      }

      function initializeManual(id, element) {
        const input = element.querySelector('[data-pdf-input]');
        const runtime = {
          element,
          document: null,
          page: 1,
          zoom: 1,
          objectUrl: null,
          renderTask: null,
          resizeTimer: null,
          loadVersion: 0,
          observer: null,
        };
        manualPdfRuntime.set(id, runtime);
        element.querySelector('[data-pdf-action="open"]')?.addEventListener('click', () => input?.click());
        element.querySelector('[data-pdf-action="previous"]')?.addEventListener('click', async () => {
          if (!runtime.document || runtime.page <= 1) return;
          runtime.page -= 1;
          await renderManualPdf(id);
        });
        element.querySelector('[data-pdf-action="next"]')?.addEventListener('click', async () => {
          if (!runtime.document || runtime.page >= runtime.document.numPages) return;
          runtime.page += 1;
          await renderManualPdf(id);
        });
        element.querySelector('[data-pdf-action="zoom-out"]')?.addEventListener('click', async () => {
          runtime.zoom = Math.max(.5, runtime.zoom - .25);
          await renderManualPdf(id);
        });
        element.querySelector('[data-pdf-action="zoom-in"]')?.addEventListener('click', async () => {
          runtime.zoom = Math.min(2.5, runtime.zoom + .25);
          await renderManualPdf(id);
        });
        input?.addEventListener('change', async () => {
          const file = input.files?.[0];
          if (!file) return;
          if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
            showToast('Choose a PDF file');
            input.value = '';
            return;
          }
          const objectUrl = URL.createObjectURL(file);
          const data = new Uint8Array(await file.arrayBuffer());
          await loadManualPdf(id, objectUrl, file.name, { objectUrl, data });
          showToast(`${file.name} opened`);
        });
        runtime.observer = new ResizeObserver(() => {
          clearTimeout(runtime.resizeTimer);
          runtime.resizeTimer = setTimeout(() => renderManualPdf(id), 80);
        });
        runtime.observer.observe(element.querySelector('.pdf-stage'));
        loadManualPdf(id, DEFAULT_MANUAL_PDF, 'HCW-7 Expanded Operator Programming Reference.pdf');
      }

      function releaseManualPdf(id) {
        const runtime = manualPdfRuntime.get(id);
        if (runtime) {
          runtime.loadVersion += 1;
          runtime.observer?.disconnect();
          clearTimeout(runtime.resizeTimer);
          runtime.renderTask?.cancel();
          runtime.document?.destroy();
          if (runtime.objectUrl) URL.revokeObjectURL(runtime.objectUrl);
        }
        manualPdfRuntime.delete(id);
        if (state[id]) state[id].data = { ...(state[id].data || {}), pdfName: 'HCW-7 EXPANDED OPERATOR PROGRAMMING REFERENCE.PDF' };
      }

      function openWindow(id) {
        if (!state[id] || !appFor(id)) return;
        const wasOpen = state[id].open;
        let element = document.querySelector(`[data-window="${id}"]`);
        if (!element) element = makeWindow(id);
        state[id].open = true;
        state[id].minimized = false;
        element.hidden = false;
        element.classList.toggle('pinned', state[id].pinned);
        element.querySelector('[data-window-action="pin"]').setAttribute('aria-pressed', String(state[id].pinned));
        state[id].maximized = false;
        state[id].restore = null;
        element.classList.remove('maximized');
        setRect(id, state[id]);
        if (state[id].appId === 'designer') renderDesigner(id);
        if (state[id].appId === 'palette') {
          renderPalette(id);
          const ownerId = state[id].data?.ownerId;
          if (ownerId && normalizeDesignerData(ownerId).paletteDocked) positionDockedPalette(ownerId);
        }
        focusWindow(id);
        renderLaunchers();
        renderTasks();
        publish('window:opened', { id }, id);
        if (!wasOpen && state[id].appId === 'designer') dockPalette(id);
      }

      function newWindow(sourceId) {
        const appId = state[sourceId]?.appId || sourceId;
        if (!apps[appId] || apps[appId].allowMultiple === false) return null;
        const instance = (instanceCounters[appId] || 1) + 1;
        instanceCounters[appId] = instance;
        const id = `${appId}-${instance}`;
        const offset = 27 * ((instance - 1) % 6);
        state[id] = createWindowState(appId, instance, offset);
        openWindow(id);
        publish('window:created', { id, appId, instance }, sourceId);
        return id;
      }

      function minimizeWindow(id) {
        const element = document.querySelector(`[data-window="${id}"]`);
        if (!element) return;
        state[id].minimized = true;
        element.hidden = true;
        if (activeId === id) {
          activeId = [...Object.keys(state)]
            .filter((key) => state[key].open && !state[key].minimized && key !== id)
            .sort((a, b) => state[b].z - state[a].z)[0] || null;
          if (activeId) focusWindow(activeId);
        }
        renderLaunchers();
        renderTasks();
        if (state[id].appId === 'palette') {
          const ownerId = state[id].data?.ownerId;
          if (ownerId) renderDesigner(ownerId);
        }
        publish('window:minimized', { id }, id);
      }

      function closeWindow(id) {
        const element = document.querySelector(`[data-window="${id}"]`);
        if (!element) return;
        const appId = state[id].appId;
        if (appId === 'manual') releaseManualPdf(id);
        if (appId === 'palette') {
          const ownerId = state[id].data?.ownerId;
          state[id].open = false;
          state[id].minimized = false;
          element.remove();
          if (activeId === id) activeId = null;
          if (ownerId) renderDesigner(ownerId);
          renderLaunchers();
          renderTasks();
          publish('window:closed', { id, appId, instance: state[id].instance }, id);
          return;
        }
        if (appId === 'designer' && state[id].data?.paletteId) {
          const paletteId = state[id].data.paletteId;
          const paletteElement = document.querySelector(`[data-window="${paletteId}"]`);
          if (state[paletteId]) {
            state[paletteId].open = false;
            state[paletteId].minimized = false;
            paletteElement?.remove();
            if (activeId === paletteId) activeId = null;
            if (paletteId !== 'palette') delete state[paletteId];
          }
        }
        const instance = state[id].instance;
        state[id].open = false;
        state[id].minimized = false;
        element.remove();
        if (activeId === id) activeId = null;
        if (instance > 1) delete state[id];
        renderLaunchers();
        renderTasks();
        publish('window:closed', { id, appId, instance }, id);
      }

      function shrinkWindow(id) {
        const element = document.querySelector(`[data-window="${id}"]`);
        if (!element) return;
        const app = appFor(id);
        state[id].maximized = false;
        state[id].restore = null;
        element.classList.remove('maximized');
        setRect(id, { x: state[id].x, y: state[id].y, w: app.minW, h: app.minH });
        if (state[id].appId === 'palette') {
          const ownerId = state[id].data?.ownerId;
          if (ownerId && normalizeDesignerData(ownerId).paletteDocked) positionDockedPalette(ownerId);
        }
        focusWindow(id);
        renderTasks();
        publish('window:shrunk', { id, w: state[id].w, h: state[id].h }, id);
      }

      function togglePin(id) {
        const element = document.querySelector(`[data-window="${id}"]`);
        if (!element) return;
        state[id].pinned = !state[id].pinned;
        element.classList.toggle('pinned', state[id].pinned);
        element.querySelector('[data-window-action="pin"]').setAttribute('aria-pressed', String(state[id].pinned));
        renderTasks();
        showToast(state[id].pinned ? `${windowTitle(id)} pinned` : `${windowTitle(id)} unpinned`);
        publish('window:pinned', { id, pinned: state[id].pinned }, id);
      }

      function closeUnpinnedWindows() {
        const closing = Object.keys(state).filter((id) => state[id].open && !state[id].pinned);
        closing.forEach(closeWindow);
        const remaining = Object.keys(state)
          .filter((id) => state[id].open && !state[id].minimized)
          .sort((a, b) => state[b].z - state[a].z);
        if (remaining[0]) focusWindow(remaining[0]);
        showToast(closing.length ? `${closing.length} unpinned window${closing.length === 1 ? '' : 's'} closed` : 'All open windows are pinned');
        publish('workspace:delete-cleanout', { closed: closing }, 'workspace');
        return closing;
      }

      function snapZone(clientX, clientY) {
        const rect = desktop.getBoundingClientRect();
        const x = clientX - rect.left;
        const y = clientY - rect.top;
        if (x <= 16) return 'left';
        if (x >= rect.width - 16) return 'right';
        return null;
      }

      function previewZone(zone) {
        if (!zone) {
          snapPreview.classList.remove('visible');
          return;
        }
        const size = planeSize();
        const rects = {
          left: { x: 5, y: 5, w: size.width / 2 - 8, h: size.height - 10 },
          right: { x: size.width / 2 + 3, y: 5, w: size.width / 2 - 8, h: size.height - 10 },
        };
        const rect = rects[zone];
        Object.assign(snapPreview.style, { left: `${rect.x}px`, top: `${rect.y}px`, width: `${rect.w}px`, height: `${rect.h}px` });
        snapPreview.classList.add('visible');
      }

      function applySnap(id, zone) {
        const size = planeSize();
        state[id].maximized = false;
        const element = document.querySelector(`[data-window="${id}"]`);
        element.classList.remove('maximized');
        if (zone === 'left') setRect(id, { x: 0, y: 0, w: size.width / 2, h: size.height });
        if (zone === 'right') setRect(id, { x: size.width / 2, y: 0, w: size.width / 2, h: size.height });
        publish('window:snapped', { id, zone }, id);
      }

      function installDrag(id, element) {
        const titlebar = element.querySelector('.titlebar');
        titlebar.addEventListener('pointerdown', (event) => {
          if (event.button !== 0 || event.target.closest('button')) return;
          event.preventDefault();
          if (state[id].appId === 'palette') {
            const ownerId = state[id].data?.ownerId;
            if (ownerId) {
              normalizeDesignerData(ownerId).paletteDocked = false;
              renderDesigner(ownerId);
              renderPalette(id);
            }
          }
          focusWindow(id);
          titlebar.setPointerCapture(event.pointerId);
          const start = { clientX: event.clientX, clientY: event.clientY, x: state[id].x, y: state[id].y };
          let zone = null;

          const move = (moveEvent) => {
            const rect = clampRect(id, {
              x: start.x + moveEvent.clientX - start.clientX,
              y: start.y + moveEvent.clientY - start.clientY,
              w: state[id].w,
              h: state[id].h,
            });
            setRect(id, rect);
            zone = snapZone(moveEvent.clientX, moveEvent.clientY);
            previewZone(zone);
          };
          const up = () => {
            titlebar.removeEventListener('pointermove', move);
            titlebar.removeEventListener('pointerup', up);
            titlebar.removeEventListener('pointercancel', up);
            snapPreview.classList.remove('visible');
            if (zone) applySnap(id, zone);
            else setRect(id, { x: snap(state[id].x), y: snap(state[id].y), w: state[id].w, h: state[id].h });
            publish('window:moved', { id, rect: { ...state[id] } }, id);
          };
          titlebar.addEventListener('pointermove', move);
          titlebar.addEventListener('pointerup', up);
          titlebar.addEventListener('pointercancel', up);
        });
      }

      function installResize(id, element) {
        element.querySelectorAll('.resize-handle').forEach((handle) => {
          handle.addEventListener('pointerdown', (event) => {
            if (event.button !== 0) return;
            event.preventDefault();
            event.stopPropagation();
            focusWindow(id);
            handle.setPointerCapture(event.pointerId);
            const direction = handle.dataset.resize;
            const start = {
              clientX: event.clientX,
              clientY: event.clientY,
              x: state[id].x,
              y: state[id].y,
              w: state[id].w,
              h: state[id].h,
            };
            const move = (moveEvent) => {
              const dx = moveEvent.clientX - start.clientX;
              const dy = moveEvent.clientY - start.clientY;
              const next = { x: start.x, y: start.y, w: start.w, h: start.h };
              if (direction.includes('e')) next.w = snap(start.w + dx);
              if (direction.includes('s')) next.h = snap(start.h + dy);
              if (direction.includes('w')) {
                const right = start.x + start.w;
                const minWidth = Math.min(appFor(id).minW, planeSize().width);
                next.x = clamp(snap(start.x + dx), 0, right - minWidth);
                next.w = right - next.x;
              }
              setRect(id, next);
            };
            const up = () => {
              handle.removeEventListener('pointermove', move);
              handle.removeEventListener('pointerup', up);
              handle.removeEventListener('pointercancel', up);
              if (state[id].appId === 'palette') {
                const ownerId = state[id].data?.ownerId;
                if (ownerId && normalizeDesignerData(ownerId).paletteDocked) positionDockedPalette(ownerId);
              }
              publish('window:resized', { id, direction, rect: { ...state[id] } }, id);
            };
            handle.addEventListener('pointermove', move);
            handle.addEventListener('pointerup', up);
            handle.addEventListener('pointercancel', up);
          });
        });
      }

      function renderLaunchers() {
        document.querySelectorAll('.launch-button').forEach((button) => {
          button.dataset.open = String(Object.values(state).some((item) => item.appId === button.dataset.app && item.open));
        });
        renderMinimized();
      }

      function renderMinimized() {
        minimizedList.innerHTML = '';
        const minimizedIds = Object.keys(state)
          .filter((id) => state[id].open && state[id].minimized)
          .sort((a, b) => state[b].z - state[a].z);
        minimizedTray.hidden = minimizedIds.length === 0;
        minimizedIds.forEach((id) => {
          const button = document.createElement('button');
          button.className = 'minimized-button';
          button.dataset.minimizedWindow = id;
          button.setAttribute('aria-label', `Restore ${windowTitle(id)}`);
          button.innerHTML = `<span class="minimized-icon">${windowCode(id)}</span><span class="minimized-name">${windowTitle(id)}</span>`;
          button.addEventListener('click', () => openWindow(id));
          minimizedList.append(button);
        });
      }

      function renderTasks() {
        if (!taskList) return;
        taskList.innerHTML = '';
        Object.keys(state).filter((id) => state[id].open && !state[id].minimized).sort((a, b) => state[a].z - state[b].z).forEach((id) => {
          const button = document.createElement('button');
          button.className = 'task-button';
          button.classList.toggle('active', id === activeId);
          button.classList.toggle('pinned', state[id].pinned);
          button.innerHTML = `<span class="task-code">${windowCode(id)}</span><span class="task-name">${windowTitle(id)}</span>`;
          button.addEventListener('click', () => {
            if (activeId === id) minimizeWindow(id);
            else focusWindow(id);
          });
          taskList.append(button);
        });
      }

      function cleanDesk(options = {}) {
        const announce = options.announce ?? true;
        const size = planeSize();
        const margin = 14;
        const gap = 12;
        const paletteGap = PALETTE_DOCK_GAP;
        const paletteOpen = Boolean(state.palette?.open);
        const paletteW = paletteOpen ? Math.min(apps.palette.minW, size.width) : 0;
        const paletteSpan = paletteOpen ? paletteW + paletteGap : 0;
        const sideW = clamp(Math.round(size.width * .31), 300, 410);
        const mainH = Math.max(320, size.height - margin * 2);
        const sideH = Math.max(190, (size.height - margin * 2 - gap) / 2);
        let placements;
        if (size.width < 760) {
          // Keep one tether-width clear so the outward palette control remains
          // visible even when the Designer is the only open compact window.
          placements = { designer: { x: 18, y: 8, w: size.width - 18, h: size.height - 16 } };
        } else if (size.width < 1100) {
          const designerX = margin + paletteSpan;
          placements = {
            ...(paletteOpen ? { palette: { x: margin, y: margin, w: paletteW, h: apps.palette.minH } } : {}),
            designer: { x: designerX, y: margin, w: size.width - designerX - margin, h: mainH },
          };
        } else {
          const designerX = margin + paletteSpan;
          const mainW = Math.max(430, size.width - designerX - sideW - margin - gap);
          placements = {
            ...(paletteOpen ? { palette: { x: margin, y: margin, w: paletteW, h: apps.palette.minH } } : {}),
            designer: { x: designerX, y: margin, w: mainW, h: mainH },
            manual: { x: designerX + mainW + gap, y: margin, w: sideW, h: sideH },
            contract: { x: designerX + mainW + gap, y: margin + sideH + gap, w: sideW, h: sideH },
          };
        }
        if (paletteOpen && state.designer?.open) {
          const data = normalizeDesignerData('designer');
          data.paletteDocked = true;
          data.paletteDockSide = 'left';
        }
        Object.keys(state).filter((id) => state[id].open).forEach((id) => {
          const element = document.querySelector(`[data-window="${id}"]`);
          state[id].maximized = false;
          element.classList.remove('maximized');
          state[id].minimized = !placements[id];
          element.hidden = state[id].minimized;
          if (placements[id]) setRect(id, placements[id], { skipDock: true });
        });
        if (paletteOpen && placements.palette && placements.designer) positionDockedPalette('designer');
        const focusId = state.designer.open ? 'designer' : Object.keys(state).find((id) => state[id].open && !state[id].minimized);
        if (focusId) focusWindow(focusId);
        renderLaunchers();
        renderTasks();
        if (announce) {
          showToast('Core windows arranged; supporting windows minimized');
          publish('workspace:cleaned', {}, 'workspace');
        }
      }

      function serializableState() {
        return Object.fromEntries(Object.entries(state).map(([id, value]) => [id, {
          appId: value.appId,
          instance: value.instance,
          open: value.open,
          minimized: value.minimized,
          maximized: value.maximized,
          pinned: value.pinned,
          x: value.x,
          y: value.y,
          w: value.w,
          h: value.h,
          z: value.z,
          restore: value.restore,
          data: value.data,
        }]));
      }

      function saveLayout() {
        const payload = { version: 6, activeId, zCounter, instanceCounters: { ...instanceCounters }, state: serializableState(), savedAt: new Date().toISOString() };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        showToast('Workspace layout saved locally');
        publish('workspace:saved', payload, 'archive');
        return payload;
      }

      function restoreLayout() {
        let payload = null;
        try { payload = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { payload = null; }
        if (!payload?.state) return false;
        Object.entries(payload.state).forEach(([id, value]) => {
          const appId = value.appId || (apps[id] ? id : id.split('-')[0]);
          if (!apps[appId]) return;
          if (!state[id]) state[id] = createWindowState(appId, value.instance || 1);
          Object.assign(state[id], value);
          state[id].appId = appId;
          state[id].instance = value.instance || 1;
          state[id].maximized = false;
          state[id].restore = null;
          instanceCounters[appId] = Math.max(instanceCounters[appId] || 1, state[id].instance);
          zCounter = Math.max(zCounter, value.z || 1);
          if (value.open) {
            openWindow(id);
            state[id].minimized = Boolean(value.minimized);
            const element = document.querySelector(`[data-window="${id}"]`);
            if (element) element.hidden = state[id].minimized;
          }
        });
        Object.entries(payload.instanceCounters || {}).forEach(([appId, count]) => {
          if (apps[appId]) instanceCounters[appId] = Math.max(instanceCounters[appId], count);
        });
        Object.keys(state).filter((id) => state[id].appId === 'designer' && state[id].open).forEach((id) => {
          const data = normalizeDesignerData(id);
          const paletteId = paletteIdForDesigner(id);
          state[paletteId].data = { ...(state[paletteId].data || {}), ownerId: id };
          if ((payload.version || 0) < 5) {
            data.paletteDocked = true;
            data.paletteDockSide = 'left';
            state[paletteId].open = true;
            state[paletteId].minimized = false;
          }
          if (state[paletteId].open) openWindow(paletteId);
          renderDesigner(id);
        });
        if (payload.activeId && state[payload.activeId]?.open && !state[payload.activeId].minimized) focusWindow(payload.activeId);
        renderLaunchers();
        renderTasks();
        showToast('Workspace layout restored');
        return true;
      }

      function handleResize() {
        const size = planeSize();
        const visible = Object.keys(state).filter((id) => state[id].open && !state[id].minimized);
        const needsReflow = visible.some((id) => state[id].x + state[id].w > size.width || state[id].y + state[id].h > size.height);
        if (needsReflow && state.designer.open) {
          cleanDesk({ announce: false });
          return;
        }
        Object.keys(state).forEach((id) => {
          if (!state[id].open || state[id].minimized) return;
          setRect(id, state[id]);
        });
      }

      document.querySelectorAll('.launch-button').forEach((button) => button.addEventListener('click', () => openWindow(button.dataset.app)));
      document.addEventListener('keydown', (event) => {
        const target = event.target;
        const isEditing = target instanceof HTMLElement && (
          target.matches('input, textarea, select') ||
          target.isContentEditable
        );
        const arrows = {
          ArrowLeft: [-72, 0],
          ArrowRight: [72, 0],
          ArrowUp: [0, -72],
          ArrowDown: [0, 72],
        };
        if (arrows[event.key] && !event.metaKey && !event.ctrlKey && !event.altKey && !isEditing && state[activeId]?.appId === 'designer') {
          event.preventDefault();
          panDesigner(activeId, ...arrows[event.key]);
          return;
        }
        if (event.key !== 'Delete' || event.metaKey || event.ctrlKey || event.altKey || isEditing) return;
        event.preventDefault();
        closeUnpinnedWindows();
      });
      window.addEventListener('resize', handleResize);
      setInterval(() => { document.querySelector('#clock').textContent = new Date().toLocaleTimeString('en-GB'); }, 1000);
      document.querySelector('#clock').textContent = new Date().toLocaleTimeString('en-GB');

      window.WorkspaceBridge = Object.freeze({
        open: openWindow,
        newWindow,
        pin: togglePin,
        closeUnpinned: closeUnpinnedWindows,
        publish,
        subscribe,
        save: saveLayout,
        getLayout: serializableState,
        panDesigner,
        zoomDesigner,
        detachPalette,
        dockPalette,
      });
      window.__workspaceDebug = {
        getState: () => ({ activeId, zCounter, instanceCounters: { ...instanceCounters }, windows: serializableState() }),
        open: openWindow,
        newWindow,
        minimize: minimizeWindow,
        close: closeWindow,
        shrink: shrinkWindow,
        pin: togglePin,
        closeUnpinned: closeUnpinnedWindows,
        clean: cleanDesk,
        save: saveLayout,
        restore: restoreLayout,
        publish,
        setRect,
        panDesigner,
        zoomDesigner,
        detachPalette,
        dockPalette,
      };

      if (!restoreLayout()) {
        openWindow('designer');
        openWindow('manual');
        openWindow('contract');
        cleanDesk({ announce: false });
      }
      renderLaunchers();
      renderTasks();
    })();
  </script>
</body>
</html>
